kind = "web"
previewPath = "/"
title = "ERB Platform"
version = "1.0.0"
id = "artifacts/erb-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23980

[services.development]
run = "pnpm --filter @workspace/erb-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/erb-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/erb-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23980"
BASE_PATH = "/"
